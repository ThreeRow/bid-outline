# Conda 环境：bid-outline-qwen-runtime-cu128
# 从本机环境导出（conda-forge + pip；含 CUDA 12.8 / torch / vllm）
# 用途：本仓库阅读、ABC、融合与HTTP服务，以及本地 Qwen/vLLM 推理运行时
#
# 创建（推荐两步，因 torch==*+cu128 需 PyTorch 额外源）：
#   conda create -n bid-outline-qwen-runtime-cu128 -c conda-forge python=3.11.15 pip -y
#   conda activate bid-outline-qwen-runtime-cu128
#   pip install -r requirements-cu128.txt \
#     --extra-index-url https://download.pytorch.org/whl/cu128
#
# 或尝试一键（部分机器上 +cu128 的 pip 钉可能解析失败）：
#   conda env create -f environment-cu128.yml
#
# 更新本文件：
#   conda env export -n bid-outline-qwen-runtime-cu128 --no-builds | grep -v '^prefix:' > environment-cu128.yml
#
